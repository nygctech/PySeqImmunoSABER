    - polyT
  nuclei:
    channel:
    - DRAQ5
feature_extraction:
  imagenet:
    R: NeuN
    G: GFAP
    B: CD29

gpu_spec:
  partition: gpu
  gres: gpu:1


celltype:
  markers: ‘path/to/celltype/markers.yaml'
