[metadata]
name = sceLDA
author = Bianca Dumitrascu
author_email = bmd39@cam.ac.uk
url = https://github.com/Computational-Morphogenomics-Group/sceLDA
project_urls =
    Bug Tracker = https://github.com/Computational-Morphogenomics-Group/sceLDA/issues
license = XXX
description = A framework to perform semantic segmentation of cellular communities from high dimensional spatially resolved biological datasets.
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Topic :: Software Development :: Testing
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Operating System :: OS Independent
    License :: OSI Approved :: GNU General Public License v3 (GPLv3)

[options]
packages = find:
include_package_data = True
python_requires = >=3.8
package_dir =
    =src
setup_requires = setuptools_scm
install_requires =
    numpy
    pandas
    torch
    torchvision
    scikit-learn
    scipy
    scikit-image
    matplotlib
    tqdm
    jupyter


[options.extras_require]
testing =
    tox
    pytest  # https://docs.pytest.org/en/latest/contents.html
    pytest-cov  # https://pytest-cov.readthedocs.io/en/latest/


[options.packages.find]
where = src
